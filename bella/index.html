<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bella — Elevated Business</title>
  <link rel="stylesheet" href="css/bella-style.css">
</head>
<body>

  <!-- ===================== NAV ===================== -->
  <header class="nav nav--calm">
    <div class="container nav__inner nav__inner--three">
      <a href="#" class="nav__logo">Elevated Business</a>

      <nav aria-label="Main navigation">
        <ul class="nav__links">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Podcast</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>

      <div class="nav__spacer"></div>

      <button class="nav__burger" aria-label="Open menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- ===================== HERO ===================== -->
  <section class="hero">
    <div class="container hero__inner">

      <!-- Left: 2/3 content -->
      <div class="hero__content">
        <h1 class="hero__h1">WOW with the<br>Bella Template</h1>
        <h2 class="hero__h2">A short powerful hook statement that includes context about what your business is and how your offering is differentiated.</h2>
        <div class="hero__cta-wrap">
          <a href="#" class="btn btn-primary hero__btn">2–4 Word CTA</a>
          <!-- 10-point starburst SVG -->
          <svg class="hero__star" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <polygon points="
              20,1
              22.5,12.4
              31.2,4.6
              26.5,15.3
              38.1,14.1
              28,20
              38.1,25.9
              26.5,24.7
              31.2,35.4
              22.5,27.6
              20,39
              17.5,27.6
              8.8,35.4
              13.5,24.7
              1.9,25.9
              12,20
              1.9,14.1
              13.5,15.3
              8.8,4.6
              17.5,12.4
            "/>
          </svg>
        </div>
      </div>

      <!-- Right: 1/3 image -->
      <div class="hero__image-col">
        <div class="hero__frame">
          <div class="hero__placeholder">
            <span>Image placeholder</span>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ===================== AS SEEN IN ===================== -->
  <section class="as-seen-in">
    <div class="container as-seen-in__inner">
      <!-- Logos / content to be added -->
    </div>
  </section>

</body>
</html>
